{% extends "base.html" %}
{% block title %}New Expense{% endblock %}
{% block content %}
<h4 class="mb-3">New Expense</h4>
<div class="card p-4" style="max-width:560px;">
<form method="post">
  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label">Date</label>
      <input type="date" name="expense_date" class="form-control" required>
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Category</label>
      <select name="category" class="form-select" required>{% for c in categories %}<option value="{{ c }}">{{ c }}</option>{% endfor %}</select>
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label">Description</label>
    <input type="text" name="description" class="form-control">
  </div>
  <div class="mb-3">
    <label class="form-label">Amount</label>
    <input type="number" step="0.01" name="amount" class="form-control" required>
  </div>
  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label">Related Batch (optional)</label>
      <select name="batch_id" class="form-select">
        <option value="">-</option>
        {% for b in batches %}<option value="{{ b.id }}">{{ b.batch_number }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Related Warehouse (optional)</label>
      <select name="warehouse_id" class="form-select">
        <option value="">-</option>
        {% for w in warehouses %}<option value="{{ w.id }}">{{ w.name }}</option>{% endfor %}
      </select>
    </div>
  </div>
  <button type="submit" class="btn btn-success">Save Expense</button>
  <a href="/expenses" class="btn btn-outline-secondary">Cancel</a>
</form>
</div>
{% endblock %}
