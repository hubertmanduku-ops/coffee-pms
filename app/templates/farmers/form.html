{% extends "base.html" %}
{% block title %}{{ 'Edit' if farmer else 'New' }} Farmer{% endblock %}
{% block content %}
<h4 class="mb-3">{{ 'Edit' if farmer else 'New' }} Farmer</h4>
<div class="card p-4" style="max-width:640px;">
<form method="post">
  <div class="mb-3">
    <label class="form-label">Full Name</label>
    <input type="text" name="full_name" class="form-control" required value="{{ farmer.full_name if farmer else '' }}">
  </div>
  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label">Phone</label>
      <input type="text" name="phone" class="form-control" value="{{ farmer.phone if farmer else '' }}">
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">National ID</label>
      <input type="text" name="national_id" class="form-control" value="{{ farmer.national_id if farmer else '' }}">
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label">Location</label>
    <input type="text" name="location" class="form-control" value="{{ farmer.location if farmer else '' }}">
  </div>
  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label">Default Arrangement</label>
      <select name="default_arrangement" class="form-select">
        <option value="purchase" {% if farmer and farmer.default_arrangement.value=='purchase' %}selected{% endif %}>Purchase</option>
        <option value="processing_on_behalf" {% if farmer and farmer.default_arrangement.value=='processing_on_behalf' %}selected{% endif %}>Processing on behalf</option>
      </select>
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Bank / Mobile Money Account</label>
      <input type="text" name="bank_account" class="form-control" value="{{ farmer.bank_account if farmer else '' }}">
    </div>
  </div>
  {% if farmer %}
  <div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" name="is_active" value="true" id="isActive" {% if farmer.is_active %}checked{% endif %}>
    <label class="form-check-label" for="isActive">Active</label>
  </div>
  {% endif %}
  <button type="submit" class="btn btn-success">Save</button>
  <a href="/farmers" class="btn btn-outline-secondary">Cancel</a>
</form>
</div>
{% endblock %}
