{% extends "base.html" %}
{% block title %}Transfer Stock{% endblock %}
{% block content %}
<h4 class="mb-3">Transfer Stock Between Warehouses</h4>
<div class="card p-4" style="max-width:560px;">
<form method="post">
  <div class="mb-3">
    <label class="form-label">From Warehouse</label>
    <select name="from_warehouse_id" class="form-select" required>{% for w in warehouses %}<option value="{{ w.id }}">{{ w.name }}</option>{% endfor %}</select>
  </div>
  <div class="mb-3">
    <label class="form-label">To Warehouse</label>
    <select name="to_warehouse_id" class="form-select" required>{% for w in warehouses %}<option value="{{ w.id }}">{{ w.name }}</option>{% endfor %}</select>
  </div>
  <div class="mb-3">
    <label class="form-label">Product</label>
    <select name="product_type" class="form-select">{% for p in product_types %}<option value="{{ p }}">{{ p.replace('_',' ')|title }}</option>{% endfor %}</select>
  </div>
  <div class="mb-3">
    <label class="form-label">Quantity (kg)</label>
    <input type="number" step="0.01" name="quantity_kg" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Notes</label>
    <input type="text" name="notes" class="form-control">
  </div>
  <button type="submit" class="btn btn-success">Transfer</button>
  <a href="/inventory" class="btn btn-outline-secondary">Cancel</a>
</form>
</div>
{% endblock %}
