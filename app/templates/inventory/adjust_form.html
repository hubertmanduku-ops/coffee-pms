{% extends "base.html" %}
{% block title %}Stock Adjustment{% endblock %}
{% block content %}
<h4 class="mb-3">Manual Stock Adjustment</h4>
<div class="card p-4" style="max-width:560px;">
<form method="post">
  <div class="mb-3">
    <label class="form-label">Warehouse</label>
    <select name="warehouse_id" class="form-select" required>{% for w in warehouses %}<option value="{{ w.id }}">{{ w.name }}</option>{% endfor %}</select>
  </div>
  <div class="mb-3">
    <label class="form-label">Product</label>
    <select name="product_type" class="form-select">{% for p in product_types %}<option value="{{ p }}">{{ p.replace('_',' ')|title }}</option>{% endfor %}</select>
  </div>
  <div class="mb-3">
    <label class="form-label">Quantity (kg) — use a negative number to reduce stock</label>
    <input type="number" step="0.01" name="quantity_kg" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Reason</label>
    <input type="text" name="notes" class="form-control" required placeholder="e.g. stock count correction, spoilage">
  </div>
  <button type="submit" class="btn btn-warning">Save Adjustment</button>
  <a href="/inventory" class="btn btn-outline-secondary">Cancel</a>
</form>
</div>
{% endblock %}
