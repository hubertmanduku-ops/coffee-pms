{% extends "base.html" %}
{% block title %}New User{% endblock %}
{% block content %}
<h4 class="mb-3">New User</h4>
<div class="card p-4" style="max-width:520px;">
<form method="post">
  <div class="mb-3"><label class="form-label">Username</label><input type="text" name="username" class="form-control" required></div>
  <div class="mb-3"><label class="form-label">Full Name</label><input type="text" name="full_name" class="form-control" required></div>
  <div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
  <div class="mb-3">
    <label class="form-label">Role</label>
    <select name="role" class="form-select">
      <option value="clerk">Clerk</option>
      <option value="manager">Manager</option>
      <option value="admin">Admin</option>
    </select>
  </div>
  <button type="submit" class="btn btn-success">Create User</button>
  <a href="/users" class="btn btn-outline-secondary">Cancel</a>
</form>
</div>
{% endblock %}
