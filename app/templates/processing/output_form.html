{% extends "base.html" %}
{% block title %}Add Processing Output{% endblock %}
{% block content %}
<h4 class="mb-3">Add Processing Output — Batch {{ batch.batch_number }}</h4>
<div class="card p-4" style="max-width:600px;">
<form method="post">
  <input type="hidden" name="batch_id" value="{{ batch.id }}">
  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label">Output Date</label>
      <input type="date" name="output_date" class="form-control" required>
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Product Type</label>
      <select name="product_type" class="form-select">
        {% for p in product_types %}<option value="{{ p }}">{{ p.replace('_',' ')|title }}</option>{% endfor %}
      </select>
    </div>
  </div>
  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label">Quantity (kg)</label>
      <input type="number" step="0.01" name="quantity_kg" class="form-control" required>
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Moisture Content (%)</label>
      <input type="number" step="0.01" name="moisture_content" class="form-control">
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label">Destination Warehouse</label>
    <select name="warehouse_id" class="form-select" required>
      {% for w in warehouses %}<option value="{{ w.id }}">{{ w.name }}</option>{% endfor %}
    </select>
  </div>
  <button type="submit" class="btn btn-success">Save Output</button>
  <a href="/batches/{{ batch.id }}" class="btn btn-outline-secondary">Cancel</a>
</form>
</div>
{% endblock %}
