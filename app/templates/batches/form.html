{% extends "base.html" %}
{% block title %}New Batch{% endblock %}
{% block content %}
<h4 class="mb-3">New Batch</h4>
<div class="card p-4" style="max-width:560px;">
<form method="post">
  <div class="mb-3">
    <label class="form-label">Batch Date</label>
    <input type="date" name="batch_date" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Notes</label>
    <textarea name="notes" class="form-control" rows="3"></textarea>
  </div>
  <button type="submit" class="btn btn-success">Create Batch</button>
  <a href="/batches" class="btn btn-outline-secondary">Cancel</a>
</form>
</div>
{% endblock %}
